<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百度搜索工具</title>
    <style>
        /* 全局样式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        /* 容器样式 */
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        
        /* 头部样式 */
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 300;
        }
        
        /* 搜索容器样式 */
        .search-container {
            display: flex;
            padding: 30px;
            gap: 0;
        }
        
        #search-input {
            flex: 1;
            padding: 15px 20px;
            font-size: 1.1rem;
            border: 2px solid #e1e5e9;
            border-right: none;
            border-radius: 8px 0 0 8px;
            transition: border-color 0.3s ease;
        }
        
        #search-input:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
        }
        
        #search-button {
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        #search-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }
        
        /* 加载状态 */
        #loading {
            display: none;
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #666;
        }
        
        /* 结果区域 */
        #results {
            padding: 0 30px 30px;
        }
        
        .results-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .results-header h2 {
            font-size: 1.8rem;
            color: #2d3748;
            margin-bottom: 10px;
        }
        
        .results-header p {
            font-size: 1rem;
            color: #718096;
        }
        
        /* 新闻列表 */
        .news-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        /* 新闻项 */
        .news-item {
            background-color: #f8fafc;
            border-radius: 8px;
            padding: 25px;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }
        
        .news-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            border-left-color: #4facfe;
        }
        
        /* 新闻标题 */
        .news-title {
            margin-bottom: 12px;
        }
        
        .news-title a {
            color: #2d3748;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1.4;
            transition: color 0.3s ease;
        }
        
        .news-title a:hover {
            color: #4facfe;
        }
        
        /* 新闻元数据 */
        .news-metadata {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #718096;
        }
        
        .news-date, .news-score, .news-comments {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        /* 新闻来源 */
        .news-source {
            font-size: 0.85rem;
            color: #a0aec0;
            font-style: italic;
        }
        
        /* 新闻摘要 */
        .news-summary {
            margin-top: 10px;
            font-size: 0.95rem;
            color: #4a5568;
            line-height: 1.5;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .search-container {
                padding: 20px;
                flex-direction: column;
            }
            
            #search-input {
                border-right: 2px solid #e1e5e9;
                border-radius: 8px;
                margin-bottom: 10px;
            }
            
            #search-button {
                border-radius: 8px;
            }
            
            #results {
                padding: 0 20px 20px;
            }
            
            .news-metadata {
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>百度搜索工具</h1>
            <p class="subtitle">基于百度搜索API的实时搜索工具</p>
        </header>
        
        <div class="search-container">
            <input type="text" id="search-input" placeholder="请输入搜索关键词...">
            <button id="search-button">搜索</button>
        </div>
        
        <div id="loading">正在搜索新闻...</div>
        
        <div id="results">
            <div id="results-header" class="results-header"></div>
            <div id="news-list" class="news-list"></div>
        </div>
    </div>

    <script>
        document.getElementById('search-button').addEventListener('click', searchNews);
        document.getElementById('search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchNews();
            }
        });

        async function searchNews() {
            const keyword = document.getElementById('search-input').value.trim();
            if (!keyword) {
                alert('请输入搜索关键词');
                return;
            }

            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            const resultsHeader = document.getElementById('results-header');
            const newsList = document.getElementById('news-list');
            
            loading.style.display = 'block';
            results.innerHTML = '';

            try {
                // 使用新的百度搜索API
                const searchUrl = 'https://qianfan.baidubce.com/v2/ai_search/web_search';
                
                const requestBody = {
                    "messages": [
                        {
                            "role": "user",
                            "content": keyword
                        }
                    ],
                    "edition": "standard",
                    "search_source": "baidu_search_v2",
                    "search_recency_filter": "week"
                };
                
                // 使用正确的Authorization头格式
                const response = await fetch(searchUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer bce-v3/ALTAK-RNgimuEPImPtxauS4AilW/52446004d8edd1c4d9676bdd4a2f4c5f614c9838'
                    },
                    body: JSON.stringify(requestBody)
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`API请求失败: ${response.status} - ${errorText}`);
                }
                
                const newsData = await response.json();
                console.log('API响应:', newsData);
                
                // 根据实际API响应格式，结果在references字段中
                let searchResults = [];
                if (newsData && newsData.references && Array.isArray(newsData.references)) {
                    // 结果在references字段中的情况
                    searchResults = newsData.references;
                } else if (newsData && newsData.results && Array.isArray(newsData.results)) {
                    // 备用：结果在results字段中的情况
                    searchResults = newsData.results;
                } else if (newsData && Array.isArray(newsData)) {
                    // 备用：直接返回数组的情况
                    searchResults = newsData;
                }
                
                if (searchResults.length > 0) {
                    const newsItems = searchResults.map(item => ({
                        title: item.title || '无标题', // 搜索结果标题
                        url: item.url || '', // 搜索结果链接
                        time: item.date ? new Date(item.date).getTime() / 1000 : Date.now() / 1000, // 发布时间
                        source: item.website || item.source || '百度搜索', // 来源
                        summary: item.snippet || item.content || '' // 摘要或内容
                    }));
                    console.log('处理后的新闻数据:', newsItems);
                    
                    // 显示搜索结果标题
                    resultsHeader.innerHTML = `<h2>搜索结果："${keyword}"</h2><p>找到 ${newsItems.length} 条相关新闻</p>`;
                    
                    // 显示新闻结果
                    newsList.innerHTML = '';
                    newsItems.forEach(item => {
                        const newsDiv = document.createElement('article');
                        newsDiv.className = 'news-item';
                        
                        const titleElement = document.createElement('h3');
                        titleElement.className = 'news-title';
                        titleElement.innerHTML = `<a href="${item.url}" target="_blank">${item.title}</a>`;
                        
                        const metadataElement = document.createElement('div');
                        metadataElement.className = 'news-metadata';
                        const date = new Date(item.time * 1000);
                        metadataElement.innerHTML = `
                            <span class="news-date">${date.toLocaleString()}</span>
                            <span class="news-source">来源: ${item.source}</span>
                        `;
                        
                        // 添加摘要
                        const summaryElement = document.createElement('div');
                        summaryElement.className = 'news-summary';
                        summaryElement.textContent = item.summary;
                        
                        newsDiv.appendChild(titleElement);
                        newsDiv.appendChild(metadataElement);
                        newsDiv.appendChild(summaryElement);
                        newsList.appendChild(newsDiv);
                    });
                } else {
                    resultsHeader.innerHTML = `<h2>搜索结果</h2><p>没有找到与"${keyword}"相关的新闻</p>`;
                    newsList.innerHTML = '';
                }
            } catch (error) {
                console.error('搜索新闻时出错:', error);
                // 确保在错误情况下也能正确显示信息
                results.innerHTML = `
                    <div class="results-header">
                        <h2>搜索结果</h2>
                        <p>搜索新闻时出错：${error.message}</p>
                    </div>
                `;
            } finally {
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
