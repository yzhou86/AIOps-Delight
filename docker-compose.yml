services:
  sci-pilot:
    image: ${DOCKERHUB_USERNAME:-pulsarpioneers}/sci-pilot:${IMAGE_VERSION:-latest}
    container_name: sci-pilot
    ports:
      - "${PORT:-5005}:5005"
    env_file:
      - .env
    environment:
      PORT: 5005
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    volumes:
      - scipilot-data:/app/backend/uploads
      - scipilot-data:/app/backend/data
    restart: unless-stopped

volumes:
  scipilot-data: